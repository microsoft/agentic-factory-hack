<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="1370" viewBox="0 0 1780 1370" font-family="Segoe UI, Arial, sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
<filter id="shadow" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter>
<style>
.title{font-size:30px;font-weight:700;fill:#0f172a;text-anchor:middle}.subtitle{font-size:16px;fill:#475569;text-anchor:middle}
.h{font-size:20px;font-weight:700}.hs{font-size:14px;fill:#64748b}
.ct{font-size:18px;font-weight:700;fill:#1e293b}.b{font-size:14.5px;fill:#334155}.k{font-size:11.5px;font-weight:700;letter-spacing:.08em}
.chip{font-size:13.5px;font-weight:700;fill:#1e293b}.chs{font-size:12px;fill:#64748b}
.lbl{font-size:12px;fill:#475569;text-anchor:middle}.ico{font-size:17px;font-weight:700;fill:#fff;text-anchor:middle}
.core{font-size:24px;font-weight:700;fill:#fff;text-anchor:middle}.foot{font-size:13px;fill:#475569;text-anchor:middle}
.card{fill:#fff;stroke:#e2e8f0;stroke-width:1;filter:url(#shadow)}
.line{stroke:#475569;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.back{stroke:#7c3aed;stroke-width:1.6;fill:none;stroke-dasharray:6 5;marker-end:url(#arrowp)}
</style></defs>
<rect width="1780" height="1370" fill="#f6f8fc"/>
<text x="890" y="46" class="title" >TriageAgent in plain words: what each part does, and why it is needed</text>
<text x="890" y="76" class="subtitle" >Agent 1 of 6 · the first check after an alarm: is this a real leak, a false alarm, or is it unclear? · for readers without a technical background</text>
<rect x="24" y="214" width="300" height="352" rx="14" class="card" data-check="The alarm"/>
<rect x="40" y="230" width="38" height="38" rx="10" fill="#dc2626"/>
<text x="59" y="255" class="ico" >1</text>
<text x="90" y="255" class="ct" >The alarm</text>
<text x="42" y="296" class="k" fill="#dc2626">WHAT IT IS</text>
<text x="42" y="317" class="b" >A pressure sensor in the pipe</text>
<text x="42" y="337" class="b" >network reports that the pressure</text>
<text x="42" y="357" class="b" >fell below its limit. An operator</text>
<text x="42" y="377" class="b" >starts the check (later an alarm</text>
<text x="42" y="397" class="b" >can start it by itself).</text>
<text x="42" y="425" class="k" fill="#dc2626">WHY IT IS NEEDED</text>
<text x="42" y="446" class="b" >On its own an alarm cannot tell a</text>
<text x="42" y="466" class="b" >burst pipe from planned valve work</text>
<text x="42" y="486" class="b" >or a busy hour. Someone has to</text>
<text x="42" y="506" class="b" >look at the context first: that is</text>
<text x="42" y="526" class="b" >this agent’s job.</text>
<rect x="364" y="108" width="640" height="640" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2.4"/>
<text x="386" y="142" class="h" fill="#2563eb">The agent (in Microsoft Foundry)</text>
<text x="386" y="164" class="hs" >it thinks and writes, but it cannot change anything</text>
<rect x="384" y="184" width="292" height="300" rx="14" class="card" data-check="The instructions"/>
<rect x="400" y="200" width="38" height="38" rx="10" fill="#3b82f6"/>
<text x="419" y="225" class="ico" >2</text>
<text x="450" y="225" class="ct" >The instructions</text>
<text x="402" y="266" class="k" fill="#3b82f6">WHAT IT IS</text>
<text x="402" y="287" class="b" >The agent’s job description and</text>
<text x="402" y="307" class="b" >working method: what to check, in</text>
<text x="402" y="327" class="b" >which order, and how a leak and a</text>
<text x="402" y="347" class="b" >false alarm look.</text>
<text x="402" y="375" class="k" fill="#3b82f6">WHY IT IS NEEDED</text>
<text x="402" y="396" class="b" >Every alarm is checked in the</text>
<text x="402" y="416" class="b" >same careful way, like a written</text>
<text x="402" y="436" class="b" >procedure. It also says: never</text>
<text x="402" y="456" class="b" >guess a number, and when in doubt</text>
<text x="402" y="476" class="b" >answer “unclear”.</text>
<rect x="692" y="184" width="292" height="300" rx="14" class="card" data-check="The AI model"/>
<rect x="708" y="200" width="38" height="38" rx="10" fill="#2563eb"/>
<text x="727" y="225" class="ico" >3</text>
<text x="758" y="225" class="ct" >The AI model</text>
<text x="710" y="266" class="k" fill="#2563eb">WHAT IT IS</text>
<text x="710" y="287" class="b" >The language model (GPT) that</text>
<text x="710" y="307" class="b" >reads all the facts the agent</text>
<text x="710" y="327" class="b" >collected.</text>
<text x="710" y="355" class="k" fill="#2563eb">WHY IT IS NEEDED</text>
<text x="710" y="376" class="b" >It weighs the evidence like an</text>
<text x="710" y="396" class="b" >experienced operator would and</text>
<text x="710" y="416" class="b" >writes a short explanation a duty</text>
<text x="710" y="436" class="b" >manager can read. It does not</text>
<text x="710" y="456" class="b" >decide on its own (see 7).</text>
<rect x="384" y="500" width="600" height="228" rx="14" class="card" data-check="The skill"/>
<rect x="400" y="516" width="38" height="38" rx="10" fill="#7c3aed"/>
<text x="419" y="541" class="ico" >4</text>
<text x="450" y="541" class="ct" >The skill</text>
<text x="402" y="582" class="k" fill="#7c3aed">WHAT IT IS</text>
<text x="402" y="603" class="b" >A reusable way of working, written once and shared by several agents:</text>
<text x="402" y="623" class="b" >here, how to cite evidence (the Diagnostic agent uses it too).</text>
<text x="402" y="651" class="k" fill="#7c3aed">WHY IT IS NEEDED</text>
<text x="402" y="672" class="b" >Every claim in the answer names where it came from and quotes the real</text>
<text x="402" y="692" class="b" >numbers, so anyone can check it.</text>
<rect x="1074" y="108" width="682" height="640" rx="22" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.4"/>
<text x="1096" y="142" class="h" fill="#92400e">Where the facts and the guidance come from</text>
<text x="1096" y="164" class="hs" >the agent asks, these systems answer</text>
<rect x="1094" y="184" width="642" height="300" rx="14" class="card" data-check="The tools (MCP)"/>
<rect x="1110" y="200" width="38" height="38" rx="10" fill="#f59e0b"/>
<text x="1129" y="225" class="ico" >5</text>
<text x="1160" y="225" class="ct" >The tools (MCP)</text>
<text x="1112" y="266" class="k" fill="#f59e0b">WHAT IT IS</text>
<text x="1112" y="287" class="b" >Safe, read-only connections to the live</text>
<text x="1112" y="307" class="b" >systems. MCP is one standard plug: every</text>
<text x="1112" y="327" class="b" >system is connected the same way.</text>
<text x="1112" y="355" class="k" fill="#f59e0b">WHY IT IS NEEDED</text>
<text x="1112" y="376" class="b" >The facts come from these systems, never</text>
<text x="1112" y="396" class="b" >from the model’s memory, so it never</text>
<text x="1112" y="416" class="b" >makes up a number. Read-only: the agent</text>
<text x="1112" y="436" class="b" >can look, not change.</text>
<rect x="1444" y="268" width="276" height="34" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<rect x="1444" y="268" width="6" height="34" rx="3" fill="#f59e0b"/>
<text x="1460" y="283" class="chip" >Nearby sensors</text>
<text x="1460" y="297" class="chs" >which sensors sit on the same pipe</text>
<rect x="1444" y="310" width="276" height="34" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<rect x="1444" y="310" width="6" height="34" rx="3" fill="#f59e0b"/>
<text x="1460" y="325" class="chip" >Readings, last 3 hours</text>
<text x="1460" y="339" class="chs" >pressure, and the water flowing in</text>
<rect x="1444" y="352" width="276" height="34" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<rect x="1444" y="352" width="6" height="34" rx="3" fill="#f59e0b"/>
<text x="1460" y="367" class="chip" >Planned works</text>
<text x="1460" y="381" class="chs" >is someone closing valves right now?</text>
<rect x="1444" y="394" width="276" height="34" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<rect x="1444" y="394" width="6" height="34" rx="3" fill="#f59e0b"/>
<text x="1460" y="409" class="chip" >Weather</text>
<text x="1460" y="423" class="chs" >frost raises the risk, proves nothing</text>
<rect x="1444" y="436" width="276" height="34" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<rect x="1444" y="436" width="6" height="34" rx="3" fill="#f59e0b"/>
<text x="1460" y="451" class="chip" >Normal usage</text>
<text x="1460" y="465" class="chs" >what is normal for this hour?</text>
<rect x="1094" y="500" width="642" height="228" rx="14" class="card" data-check="The knowledge (Foundry IQ)"/>
<rect x="1110" y="516" width="38" height="38" rx="10" fill="#0e7490"/>
<text x="1129" y="541" class="ico" >6</text>
<text x="1160" y="541" class="ct" >The knowledge (Foundry IQ)</text>
<text x="1112" y="582" class="k" fill="#0e7490">WHAT IT IS</text>
<text x="1112" y="603" class="b" >The company’s own playbooks and lessons from earlier incidents, which the</text>
<text x="1112" y="623" class="b" >agent can search.</text>
<text x="1112" y="651" class="k" fill="#0e7490">WHY IT IS NEEDED</text>
<text x="1112" y="672" class="b" >It helps compare what the agent sees with past experience. It is guidance, not</text>
<text x="1112" y="692" class="b" >data: a document can never close an alarm.</text>
<path d="M324,390 L362,390" class="line"/>
<text x="343" y="378" class="lbl" >alarm</text>
<path d="M1004,250 L1072,250" class="line"/>
<text x="1039" y="223" class="lbl" >asks for</text>
<text x="1039" y="238" class="lbl" >facts</text>
<path d="M1072,282 L1006,282" class="back"/>
<text x="1039" y="302" class="lbl" >answers</text>
<path d="M1004,600 L1072,600" class="line"/>
<text x="1039" y="573" class="lbl" >asks for</text>
<text x="1039" y="588" class="lbl" >guidance</text>
<path d="M1072,632 L1006,632" class="back"/>
<text x="1039" y="652" class="lbl" >advice</text>
<rect x="24" y="792" width="500" height="330" rx="14" class="card" data-check="Rule checks in code"/>
<rect x="40" y="808" width="38" height="38" rx="10" fill="#b45309"/>
<text x="59" y="833" class="ico" >7</text>
<text x="90" y="833" class="ct" >Rule checks in code</text>
<text x="42" y="874" class="k" fill="#b45309">WHAT IT IS</text>
<text x="42" y="895" class="b" >Fixed rules in ordinary software that check the model’s</text>
<text x="42" y="915" class="b" >answer against the data before anything happens.</text>
<text x="42" y="943" class="k" fill="#b45309">WHY IT IS NEEDED</text>
<text x="42" y="964" class="b" >A second pair of eyes. The answer must quote the alarm</text>
<text x="42" y="984" class="b" >sensor’s own readings and have enough evidence, or it</text>
<text x="42" y="1004" class="b" >becomes “unclear”. A false alarm is only accepted when the</text>
<text x="42" y="1024" class="b" >planned-works list really shows work going on: closing a</text>
<text x="42" y="1044" class="b" >real leak would be the worst mistake. The model gets one</text>
<text x="42" y="1064" class="b" >more try.</text>
<rect x="584" y="792" width="620" height="330" rx="14" class="card"/>
<rect x="600" y="808" width="38" height="38" rx="10" fill="#10b981"/>
<text x="619" y="833" class="ico" >8</text>
<text x="650" y="833" class="ct" >The verdict: three possible outcomes</text>
<rect x="600" y="864" width="588" height="70" rx="10" fill="#fef2f2"/>
<text x="618" y="892" class="ct" fill="#991b1b">Genuine leak → the next agent</text>
<text x="618" y="916" class="b" >The Diagnostic agent finds the pipe, the valves and the customers.</text>
<rect x="600" y="946" width="588" height="70" rx="10" fill="#f0fdf4"/>
<text x="618" y="974" class="ct" fill="#166534">False alarm → closed, with proof</text>
<text x="618" y="998" class="b" >Only with planned work that explains the drop.</text>
<rect x="600" y="1028" width="588" height="70" rx="10" fill="#fffbeb"/>
<text x="618" y="1056" class="ct" fill="#92400e">Unclear → a person decides</text>
<text x="618" y="1080" class="b" >The flow stops and the control room takes over.</text>
<rect x="1264" y="792" width="492" height="330" rx="14" class="card" data-check="Trace and evaluation"/>
<rect x="1280" y="808" width="38" height="38" rx="10" fill="#0f766e"/>
<text x="1299" y="833" class="ico" >9</text>
<text x="1330" y="833" class="ct" >Trace and evaluation</text>
<text x="1282" y="874" class="k" fill="#0f766e">WHAT IT IS</text>
<text x="1282" y="895" class="b" >Every step is recorded: which facts were looked up, what</text>
<text x="1282" y="915" class="b" >the model answered and how long it took. Four test cases (a</text>
<text x="1282" y="935" class="b" >burst, planned work, an alarm text that tries to trick the</text>
<text x="1282" y="955" class="b" >agent, a sensor that does not exist) can be run again after</text>
<text x="1282" y="975" class="b" >every change.</text>
<text x="1282" y="1003" class="k" fill="#0f766e">WHY IT IS NEEDED</text>
<text x="1282" y="1024" class="b" >A decision can be explained afterwards, and a change is</text>
<text x="1282" y="1044" class="b" >tested before it goes live.</text>
<path d="M450,748 L450,790" class="line"/>
<text x="512" y="774" class="lbl" >proposed answer</text>
<path d="M524,957 L582,957" class="line"/>
<text x="553" y="945" class="lbl" >checked</text>
<path d="M1204,957 L1262,957" class="line"/>
<text x="1233" y="945" class="lbl" >recorded</text>
<rect x="24" y="1164" width="1100" height="150" rx="14" class="card"/>
<rect x="40" y="1180" width="38" height="38" rx="10" fill="#dc2626"/>
<text x="59" y="1205" class="ico" >!</text>
<text x="90" y="1205" class="ct" >The burst example in plain words (a real run of the demo)</text>
<text x="42" y="1240" class="b" >At night the pressure at one sensor fell from 4.89 to 2.85 bar, while the water flowing into the district rose to 121 m³/h:</text>
<text x="42" y="1262" class="b" >normal for that hour is at most about 48. There was no planned work. The agent looked up 9 facts and sources and concluded</text>
<text x="42" y="1284" class="b" >“genuine leak”, 96% sure, in about 17 seconds. The rules agreed, so the next agent took over.</text>
<rect x="1164" y="1164" width="592" height="150" rx="14" fill="#0f172a"/>
<text x="1460" y="1214" class="core" >The model judges and writes.</text>
<text x="1460" y="1248" class="core" >Code owns the facts.</text>
<text x="1460" y="1282" class="core" >A person decides when unclear.</text>
<text x="890" y="1348" class="foot" >All data is simulated · the technical version of this picture is docs/architecture-triage-agent.png</text>
</svg>
