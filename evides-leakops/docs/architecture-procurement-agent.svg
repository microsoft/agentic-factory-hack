<text x="172" y="782" class="sec" >What goes in, what comes out, and how it decides</text>
<rect x="170" y="794" width="420" height="330" rx="14" class="card"/>
<rect x="184" y="808" width="36" height="36" rx="9" fill="#7c3aed"/>
<text x="202" y="830" class="ico" >{}</text>
<text x="232" y="824" class="ct" style="font-size:13px">Answer: ProcurementJudgement → ProcurementResult</text>
<text x="232" y="842" class="cs" >what the model decides, then what code books</text>
<rect x="184" y="856" width="392" height="254" rx="10" fill="#0b1220"/>
<text x="196" y="878" font-family="Consolas, Menlo, monospace" font-size="11.2" fill="#7dd3fc" xml:space="preserve">// ProcurementJudgement (the model)</text>
<text x="196" y="897" font-family="Consolas, Menlo, monospace" font-size="11.2" fill="#cbd5e1" xml:space="preserve">{ "partSkus": [ … ], "equipmentSkus": [ … ],</text>
<text x="196" y="916" font-family="Consolas, Menlo, monospace" font-size="11.2" fill="#cbd5e1" xml:space="preserve">  "rationale": "I included the always-required</text>
<text x="196" y="935" font-family="Consolas, Menlo, monospace" font-size="11.2" fill="#cbd5e1" xml:space="preserve">    parts CLP-CI-300, GSK-300, BLT-KIT-300…" }</text>
<text x="196" y="954" font-family="Consolas, Menlo, monospace" font-size="11.2" fill="#cbd5e1" xml:space="preserve"></text>
<text x="196" y="973" font-family="Consolas, Menlo, monospace" font-size="11.2" fill="#7dd3fc" xml:space="preserve">// ProcurementResult (code)</text>
<text x="196" y="992" font-family="Consolas, Menlo, monospace" font-size="11.2" fill="#cbd5e1" xml:space="preserve">{ "lines": [ 9 items: 8 reserved,</text>
<text x="196" y="1011" font-family="Consolas, Menlo, monospace" font-size="11.2" fill="#cbd5e1" xml:space="preserve">    CPL-FLEX-300 partly reserved ],</text>
<text x="196" y="1030" font-family="Consolas, Menlo, monospace" font-size="11.2" fill="#cbd5e1" xml:space="preserve">  "purchaseOrders": [ CPL-FLEX-300 express 675 EUR,</text>
<text x="196" y="1049" font-family="Consolas, Menlo, monospace" font-size="11.2" fill="#cbd5e1" xml:space="preserve">    CPL-FLEX-300 restock 2,160 EUR,</text>
<text x="196" y="1068" font-family="Consolas, Menlo, monospace" font-size="11.2" fill="#cbd5e1" xml:space="preserve">    CLP-CI-300 restock 4,110 EUR pending_approval ],</text>
<text x="196" y="1087" font-family="Consolas, Menlo, monospace" font-size="11.2" fill="#cbd5e1" xml:space="preserve">  "packageComplete": false }</text>
<rect x="610" y="794" width="560" height="330" rx="14" class="card"/>
<rect x="624" y="808" width="36" height="36" rx="9" fill="#be185d"/>
<text x="642" y="830" class="ico" >?</text>
<text x="672" y="824" class="ct" >What gets reserved and ordered</text>
<text x="672" y="842" class="cs" >the model plans, the rules and the tools book</text>
<rect x="624" y="856" width="532" height="81" rx="10" fill="#eff6ff"/>
<text x="638" y="876" class="ct" fill="#1e40af">What gets reserved</text>
<text x="638" y="894" class="cs" >every part marked "always" in the procedure</text>
<text x="638" y="911" class="cs" >conditional parts when the condition applies</text>
<text x="638" y="928" class="cs" >smallest sufficient equipment, available now</text>
<rect x="624" y="945" width="532" height="81" rx="10" fill="#fef2f2"/>
<text x="638" y="965" class="ct" fill="#991b1b">What gets ordered</text>
<text x="638" y="983" class="cs" >express for what this repair is short of</text>
<text x="638" y="1000" class="cs" >standard to restock below the reorder level</text>
<text x="638" y="1017" class="cs" >above 2,500 EUR: pending_approval (a person)</text>
<rect x="624" y="1034" width="532" height="81" rx="10" fill="#fffbeb"/>
<text x="638" y="1054" class="ct" fill="#92400e">Real result</text>
<text x="638" y="1072" class="cs" >9 items reserved, coupling DN300 short</text>
<text x="638" y="1089" class="cs" >express order 675 EUR for CPL-FLEX-300</text>
<text x="638" y="1106" class="cs" >clamp restock 4,110 EUR waits for approval</text>
<rect x="1190" y="794" width="550" height="330" rx="14" class="card"/>
<rect x="1204" y="808" width="36" height="36" rx="9" fill="#0e7490"/>
<text x="1222" y="830" class="ico" >RUN</text>
<text x="1252" y="824" class="ct" >The real run of the deployed demo</text>
<text x="1252" y="842" class="cs" >captured 2026-11-16 (simulated data)</text>
<rect x="1204" y="856" width="522" height="85" rx="10" fill="#eff6ff"/>
<text x="1218" y="877" class="ct" >Burst on a cast-iron main</text>
<text x="1218" y="896" class="cs" >13.5 s · 7,610 + 429 tokens</text>
<text x="1218" y="913" class="cs" >2 MCP tool calls by the model, 1 knowledge lookup</text>
<text x="1218" y="930" class="cs" >15 calls made by the code (rules)</text>
<rect x="1204" y="951" width="522" height="85" rx="10" fill="#f0fdf4"/>
<text x="1218" y="972" class="ct" >Result</text>
<text x="1218" y="991" class="cs" >stock moves in the warehouse app after this step</text>
<text x="1218" y="1008" class="cs" >3 purchase orders, 1 waiting for approval</text>
<text x="1218" y="1025" class="cs" >the missing coupling is counted in the ETA later</text>
<rect x="1204" y="1046" width="522" height="68" rx="10" fill="#f8fafc"/>
<text x="1218" y="1067" class="ct" >Guardrails shown</text>
<text x="1218" y="1086" class="cs" >the model can never reserve outside the procedure</text>
<text x="1218" y="1103" class="cs" >the same incident and SKU is only booked once</text>
<text x="890" y="1186" class="lbl" >All data is simulated · ProcurementAgent is registered by LeakOps.AgentRegistry (instructions, tools, knowledge, skills, answer schema) and visible in the Foundry portal · code: src/LeakOps.Agents/ProcurementAgent.cs</text>
