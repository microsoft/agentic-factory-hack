<rect width="1780" height="1210" fill="#f6f8fc"/>
<text x="890" y="44" class="title" >TriageAgent — one Foundry agent with 5 C# MCP tools, a knowledge base and a skill</text>
<text x="890" y="70" class="subtitle" >Agent 1 of 6 · decides whether a SCADA alarm is a genuine leak, a false alarm or unclear · read-only: it can look at data, nothing else</text>
<rect x="150" y="96" width="1610" height="1050" rx="22" fill="none" stroke="#3a9a4a" stroke-width="2" stroke-dasharray="9 7"/>
<text x="172" y="122" class="zone" >Resource group rg-evides-ai-demo · agent name TriageAgent · gpt-5.4 (Global Standard) · the model proposes, code checks and decides</text>
<rect x="12" y="250" width="116" height="150" rx="12" class="card"/>
<rect x="22" y="262" width="30" height="30" rx="9" fill="#dc2626"/>
<text x="37" y="281" class="ico" >SC</text>
<text x="66" y="282" class="ct" >Alarm</text>
<text x="70" y="316" class="cs" text-anchor="middle">PS-101 · D-01</text>
<text x="70" y="332" class="cs" text-anchor="middle">2.85 bar</text>
<text x="70" y="348" class="cs" text-anchor="middle">limit 3.00 bar</text>
<text x="70" y="364" class="cs" text-anchor="middle">04:10 local</text>
<text x="70" y="380" class="cs" text-anchor="middle">simulated</text>
<text x="70" y="440" class="ct" text-anchor="middle">Operator</text>
<text x="70" y="456" class="cs" text-anchor="middle">starts the run</text>
<rect x="170" y="146" width="330" height="612" rx="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.4"/>
