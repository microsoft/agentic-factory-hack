<text x="244" y="186" class="h" >1. Workflow host</text>
<text x="244" y="206" class="hs" >leakops-workflow-88546e</text>
<text x="335" y="742" class="foot" fill="#7c3aed">Operator key on every /api call</text>
<rect x="540" y="146" width="330" height="612" rx="22" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.4"/>
<rect x="556" y="162" width="46" height="46" rx="9" fill="#f59e0b"/>
<text x="579" y="189" class="ico" >fn</text>
<text x="614" y="186" class="h" >2. Agents app</text>
<text x="614" y="206" class="hs" >leakops-agents-88546e · Functions Flex</text>
<text x="705" y="742" class="foot" fill="#f59e0b">The code never trusts the model blindly</text>
<rect x="910" y="146" width="330" height="612" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2.4"/>
<rect x="926" y="162" width="46" height="46" rx="9" fill="#2563eb"/>
<text x="949" y="189" class="ico" >AI</text>
<text x="984" y="186" class="h" >3. TriageAgent in Foundry</text>
<text x="984" y="206" class="hs" >project evides-leakops · version 4</text>
<text x="1075" y="742" class="foot" fill="#2563eb">Playground · Traces · Evaluation (4 questions)</text>
<rect x="1280" y="146" width="460" height="612" rx="22" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.4"/>
<rect x="1296" y="162" width="46" height="46" rx="9" fill="#f59e0b"/>
<text x="1319" y="189" class="ico" >fn</text>
<text x="1354" y="186" class="h" >4. MCP server (5 of 19 tools)</text>
<text x="1354" y="206" class="hs" >leakops-mcp-88546e · allow-list for TriageAgent</text>
<text x="1510" y="742" class="foot" fill="#f59e0b">Read-only tools, no write access</text>
<rect x="180" y="232" width="310" height="116" rx="14" class="card"/>
<rect x="194" y="246" width="36" height="36" rx="9" fill="#a78bfa"/>
<text x="212" y="268" class="ico" >IN</text>
<text x="242" y="262" class="ct" >Alarm payload (data)</text>
<text x="242" y="282" class="cs" >alarmId, sensorId, districtId, time,</text>
<text x="242" y="299" class="cs" >metric, observed value, limits, message</text>
<text x="242" y="316" class="cs" >the text is data, never instructions</text>
<rect x="180" y="356" width="310" height="116" rx="14" class="card"/>
<rect x="194" y="370" width="36" height="36" rx="9" fill="#a78bfa"/>
<text x="212" y="392" class="ico" >1-6</text>
<text x="242" y="386" class="ct" >Workflow runner</text>
<text x="242" y="406" class="cs" >step 1 of 6; sends the alarm on</text>
<text x="242" y="423" class="cs" >false alarm closes the run, uncertain</text>
<text x="242" y="440" class="cs" >stops it for a person (needs_review)</text>
<rect x="180" y="480" width="310" height="116" rx="14" class="card"/>
<rect x="194" y="494" width="36" height="36" rx="9" fill="#10b981"/>
<text x="212" y="516" class="ico" >OK</text>
<text x="242" y="510" class="ct" >Verdict routes the flow</text>
<text x="242" y="530" class="cs" >genuine_leak → next step: diagnose</text>
<text x="242" y="547" class="cs" >false_alarm → close_alarm</text>
<text x="242" y="564" class="cs" >uncertain → manual_review</text>
<rect x="550" y="232" width="310" height="116" rx="14" class="card"/>
<rect x="564" y="246" width="36" height="36" rx="9" fill="#f59e0b"/>
<text x="582" y="268" class="ico" >fn</text>
<text x="612" y="262" class="ct" >Triage function</text>
<text x="612" y="282" class="cs" >POST /api/agents/triage</text>
<text x="612" y="299" class="cs" >function key from the workflow host</text>
<text x="612" y="316" class="cs" >TriageAgent.TriageAsync</text>
<rect x="550" y="356" width="310" height="116" rx="14" class="card"/>
<rect x="564" y="370" width="36" height="36" rx="9" fill="#f59e0b"/>
<text x="582" y="392" class="ico" >RT</text>
<text x="612" y="386" class="ct" >Agent runtime</text>
<text x="612" y="406" class="cs" >calls TriageAgent by name (latest version)</text>
<text x="612" y="423" class="cs" >MaxOutputTokens 8000, typed JSON answer</text>
<text x="612" y="440" class="cs" >trace: model, tokens, tool calls, time</text>
<rect x="550" y="480" width="310" height="116" rx="14" class="card"/>
<rect x="564" y="494" width="36" height="36" rx="9" fill="#f59e0b"/>
<text x="582" y="516" class="ico" >✓</text>
<text x="612" y="510" class="ct" >Rule check: Normalize</text>
<text x="612" y="530" class="cs" >identity copied from the alarm</text>
<text x="612" y="547" class="cs" >values in range, nextStep follows verdict</text>
<text x="612" y="564" class="cs" >must name the alarm sensor with a reading</text>
<rect x="550" y="604" width="310" height="116" rx="14" class="card"/>
<rect x="564" y="618" width="36" height="36" rx="9" fill="#f59e0b"/>
<text x="582" y="640" class="ico" >✓</text>
<text x="612" y="634" class="ct" >Rule check: close needs proof</text>
<text x="612" y="654" class="cs" >(rules) get-planned-works read by code</text>
<text x="612" y="671" class="cs" >false_alarm only with an ACTIVE planned work</text>
<text x="612" y="688" class="cs" >otherwise it becomes uncertain; 1 retry</text>
<rect x="920" y="232" width="310" height="116" rx="14" class="card"/>
<rect x="934" y="246" width="36" height="36" rx="9" fill="#3b82f6"/>
<text x="952" y="268" class="ico" >IN</text>
<text x="982" y="262" class="ct" >Instructions (5 steps)</text>
<text x="982" y="282" class="cs" >list-sensors → readings (3 h) → planned works</text>
<text x="982" y="299" class="cs" >→ weather (12 h) → usage history</text>
<text x="982" y="316" class="cs" >never guess a number; no tool = uncertain</text>
<rect x="920" y="356" width="310" height="116" rx="14" class="card"/>
<rect x="934" y="370" width="36" height="36" rx="9" fill="#3b82f6"/>
<text x="952" y="392" class="ico" >LLM</text>
<text x="982" y="386" class="ct" >gpt-5.4 deployment</text>
<text x="982" y="406" class="cs" >Global Standard · content filter DefaultV2</text>
<text x="982" y="423" class="cs" >real burst run: 9,365 tokens in, 1,120 out</text>
<text x="982" y="440" class="cs" >about 17 s with 9 tool calls</text>
<rect x="920" y="480" width="310" height="116" rx="14" class="card"/>
<rect x="934" y="494" width="36" height="36" rx="9" fill="#2563eb"/>
<text x="952" y="516" class="ico" >IQ</text>
<text x="982" y="510" class="ct" >Foundry IQ: leakops-ops-kb</text>
<text x="982" y="530" class="cs" >called once, after the data tools</text>
<text x="982" y="547" class="cs" >via connection leakops-kb-ops</text>
<text x="982" y="564" class="cs" >guidance only, can never close an alarm</text>
<rect x="920" y="604" width="310" height="116" rx="14" class="card"/>
<rect x="934" y="618" width="36" height="36" rx="9" fill="#7c3aed"/>
<text x="952" y="640" class="ico" >SK</text>
<text x="982" y="634" class="ct" >Skill: evidence-citation</text>
<text x="982" y="654" class="cs" >how to write source, finding, supports</text>
<text x="982" y="671" class="cs" >how to cite a knowledge document</text>
<text x="982" y="688" class="cs" >published from skills/evidence-citation</text>
<rect x="1290" y="232" width="440" height="372" rx="14" class="card"/>
<rect x="1304" y="246" width="36" height="36" rx="9" fill="#1e293b"/>
<text x="1322" y="268" class="ico" >5</text>
<text x="1352" y="262" class="ct" >C# tools the agent may call [McpToolTrigger]</text>
<text x="1352" y="280" class="cs" >tool → Cosmos DB container it reads (LeakOpsDB)</text>
<rect x="1306" y="298" width="200" height="22" rx="11" fill="#1e293b" />
<text x="1406" y="313" class="pill" fill="#fff">list-sensors</text>
<text x="1516" y="313" class="ct" >→</text>
<rect x="1536" y="298" width="178" height="22" rx="11" fill="#0369a1" />
<text x="1625" y="313" class="pill" fill="#fff">Sensors</text>
<text x="1306" y="338" class="cs" >sensors of the district, neighbours, limits</text>
<rect x="1306" y="360" width="200" height="22" rx="11" fill="#1e293b" />
<text x="1406" y="375" class="pill" fill="#fff">get-sensor-readings</text>
<text x="1516" y="375" class="ct" >→</text>
<rect x="1536" y="360" width="178" height="22" rx="11" fill="#0369a1" />
<text x="1625" y="375" class="pill" fill="#fff">SensorReadings</text>
<text x="1306" y="400" class="cs" >10-minute values, 3 h window (called 3-4×)</text>
<rect x="1306" y="422" width="200" height="22" rx="11" fill="#1e293b" />
<text x="1406" y="437" class="pill" fill="#fff">get-planned-works</text>
<text x="1516" y="437" class="ct" >→</text>
<rect x="1536" y="422" width="178" height="22" rx="11" fill="#0369a1" />
<text x="1625" y="437" class="pill" fill="#fff">PlannedWorks</text>
<text x="1306" y="462" class="cs" >valve work that can explain a pressure drop</text>
<rect x="1306" y="484" width="200" height="22" rx="11" fill="#1e293b" />
<text x="1406" y="499" class="pill" fill="#fff">get-weather</text>
<text x="1516" y="499" class="ct" >→</text>
<rect x="1536" y="484" width="178" height="22" rx="11" fill="#0369a1" />
<text x="1625" y="499" class="pill" fill="#fff">WeatherObservations</text>
<text x="1306" y="524" class="cs" >frost raises the risk, never proves a burst</text>
<rect x="1306" y="546" width="200" height="22" rx="11" fill="#1e293b" />
<text x="1406" y="561" class="pill" fill="#fff">get-usage-history</text>
<text x="1516" y="561" class="ct" >→</text>
<rect x="1536" y="546" width="178" height="22" rx="11" fill="#0369a1" />
<text x="1625" y="561" class="pill" fill="#fff">UsageProfiles + UsageEvents</text>
<text x="1306" y="586" class="cs" >what normal is for this hour, known deviations</text>
<rect x="1290" y="616" width="440" height="100" rx="14" class="card"/>
<rect x="1304" y="630" width="36" height="36" rx="9" fill="#2563eb"/>
<text x="1322" y="652" class="ico" >IQ</text>
<text x="1352" y="646" class="ct" >knowledge_base_retrieve (MCP)</text>
<text x="1352" y="666" class="cs" >second MCP tool on the agent, server label leakops_kb</text>
<text x="1352" y="683" class="cs" >allowed tool: knowledge_base_retrieve only</text>
<text x="519" y="318" class="lbl" >alarm</text>
<text x="519" y="330" class="lbl" >+ key</text>
<path d="M500,344 L538,344" class="line"/>
<text x="889" y="318" class="lbl" >call</text>
<text x="889" y="330" class="lbl" >agent</text>
<path d="M870,344 L908,344" class="line"/>
<text x="1259" y="318" class="lbl" >MCP</text>
<text x="1259" y="330" class="lbl" >tools</text>
<path d="M1240,344 L1278,344" class="line"/>
<path d="M114,330 L168,330" class="line"/>
<text x="889" y="650" class="lbl" >verdict</text>
<text x="889" y="662" class="lbl" >JSON</text>
<path d="M908,676 L872,676" class="dash"/>
<text x="519" y="650" class="lbl" >checked</text>
<text x="519" y="662" class="lbl" >verdict</text>
<path d="M538,676 L502,676" class="dash"/>
<text x="172" y="782" class="sec" >What goes in, what comes out, and how it decides</text>
<rect x="170" y="794" width="420" height="330" rx="14" class="card"/>
<rect x="184" y="808" width="36" height="36" rx="9" fill="#7c3aed"/>
<text x="202" y="830" class="ico" >{}</text>
<text x="232" y="824" class="ct" >Answer: TriageVerdict (typed JSON)</text>
<text x="232" y="842" class="cs" >a real answer of the burst run, shortened</text>
<rect x="184" y="856" width="392" height="254" rx="10" fill="#0b1220"/>
<text x="196" y="878" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#cbd5e1" xml:space="preserve">{</text>
<text x="196" y="897" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#cbd5e1" xml:space="preserve">  "verdict": "genuine_leak",</text>
<text x="196" y="916" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#cbd5e1" xml:space="preserve">  "confidence": 0.96,</text>
<text x="196" y="935" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#cbd5e1" xml:space="preserve">  "summary": "Pressure fell sharply at PS-101 … inflow</text>
<text x="196" y="954" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#cbd5e1" xml:space="preserve">    far above the night-time p95, no planned works",</text>
<text x="196" y="973" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#cbd5e1" xml:space="preserve">  "evidence": [ { "source": "get-sensor-readings",</text>
<text x="196" y="992" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#cbd5e1" xml:space="preserve">    "finding": "PS-101 fell from 4.89 to 2.85 bar",</text>
<text x="196" y="1011" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#cbd5e1" xml:space="preserve">    "supports": "leak" }, … 3-6 items ],</text>
<text x="196" y="1030" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#cbd5e1" xml:space="preserve">  "suspectedSegmentId": "SEG-0412",</text>
<text x="196" y="1049" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#cbd5e1" xml:space="preserve">  "nextStep": "diagnose",</text>
<text x="196" y="1068" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#cbd5e1" xml:space="preserve">  "alarmId", "districtId", "sensorId", "triggeredAtUtc"</text>
<text x="196" y="1087" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#cbd5e1" xml:space="preserve">}</text>
<rect x="610" y="794" width="560" height="330" rx="14" class="card"/>
<rect x="624" y="808" width="36" height="36" rx="9" fill="#be185d"/>
<text x="642" y="830" class="ico" >?</text>
<text x="672" y="824" class="ct" >How the agent decides (from its instructions)</text>
<text x="672" y="842" class="cs" >the tools give the facts, the model weighs them</text>
<rect x="624" y="856" width="532" height="81" rx="10" fill="#fef2f2"/>
<text x="638" y="876" class="ct" fill="#991b1b">genuine_leak: leak or burst signature</text>
<text x="638" y="894" class="cs" >pressure falls most at the sensor nearest one segment</text>
<text x="638" y="911" class="cs" >district inflow RISES above the p95 for this hour</text>
<text x="638" y="928" class="cs" >no planned work, weather or normal usage explains it</text>
<rect x="624" y="945" width="532" height="81" rx="10" fill="#f0fdf4"/>
<text x="638" y="965" class="ct" fill="#166534">false_alarm: a harmless explanation</text>
<text x="638" y="983" class="cs" >a planned work is active on a connected segment</text>
<text x="638" y="1000" class="cs" >pressure change matches it, inflow falls or stays normal</text>
<text x="638" y="1017" class="cs" >closing needs the planned-works register, checked by code</text>
<rect x="624" y="1034" width="532" height="64" rx="10" fill="#fffbeb"/>
<text x="638" y="1054" class="ct" fill="#92400e">uncertain: a person looks</text>
<text x="638" y="1072" class="cs" >evidence conflicts or is incomplete, a tool errors</text>
<text x="638" y="1089" class="cs" >the alarm sensor does not exist or cannot be read</text>
<rect x="1190" y="794" width="550" height="330" rx="14" class="card"/>
<rect x="1204" y="808" width="36" height="36" rx="9" fill="#0e7490"/>
<text x="1222" y="830" class="ico" >RUN</text>
<text x="1252" y="824" class="ct" >Two real runs of the deployed demo</text>
<text x="1252" y="842" class="cs" >captured 2026-11-16 (simulated data)</text>
<rect x="1204" y="856" width="522" height="85" rx="10" fill="#fef2f2"/>
<text x="1218" y="877" class="ct" >Burst on a cast-iron main → genuine_leak (0.96)</text>
<text x="1218" y="896" class="cs" >17.0 s · 9,365 + 1,120 tokens · 9 calls: list-sensors,</text>
<text x="1218" y="913" class="cs" >get-sensor-readings ×4, get-planned-works, get-weather,</text>
<text x="1218" y="930" class="cs" >get-usage-history, knowledge_base_retrieve</text>
<rect x="1204" y="951" width="522" height="85" rx="10" fill="#f0fdf4"/>
<text x="1218" y="972" class="ct" >Planned valve work PW-7781 → false_alarm (0.95)</text>
<text x="1218" y="991" class="cs" >17.7 s · 9,359 + 1,012 tokens · 8 calls plus 1 code call:</text>
<text x="1218" y="1008" class="cs" >(rules) get-planned-works confirms the work is active</text>
<text x="1218" y="1025" class="cs" >inflow fell to 112 m3/h, normal p95 is 188.8</text>
<rect x="1204" y="1046" width="522" height="68" rx="10" fill="#f8fafc"/>
<text x="1218" y="1067" class="ct" >Guardrails shown</text>
<text x="1218" y="1086" class="cs" >alarm text with injected instructions → ignored (data)</text>
<text x="1218" y="1103" class="cs" >unknown sensor → uncertain, never judged from others</text>
<text x="890" y="1186" class="lbl" >All data is simulated · TriageAgent is registered by LeakOps.AgentRegistry (instructions, tools, knowledge, skill, answer schema) and visible in the Foundry portal</text>
</svg>